; carrier-sipcause-gosub.conf - GenX, final Aragon state 2026-10-29 ("v4", TBI carrier with TBI_1..3 failover)
; See ../amdy-and-carrier-status-maps.md section 3. Route prefixes masked; adjust "SIP/TBI_" to your peers.
;  - Gosub(gxsipcause) right after EVERY Dial() (keeps Dial's priority number - safe live reload)
;  - no failover on SIP 603 (REGEX on GXSIPCAUSE); 486/480/403, 404, 503 still fail over
;  - h line logs GXSIPCAUSE only when the call was NOT answered
;  - REQUIRED with any trunk failover: the agi-VDAD_local_optimize.agi ORDER BY fix (optimize-newest-attempt.patch)

; ---- 1. [default] h handler (extensions.conf on every dialer; replace the stock line in [default] only) ----
exten => h,1,AGI(agi://127.0.0.1:4577/call_log--HVcauses--PRI-----NODEBUG-----${HANGUPCAUSE}-----${DIALSTATUS}-----${DIALEDTIME}-----${ANSWEREDTIME}-----${IF($["${GXSIPCAUSE}"!="" & "${DIALSTATUS}"!="ANSWER"]?${GXSIPCAUSE}:${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)})}))

; ---- 2. carrier entry (first route shown; same pattern on every route) ----
exten => _781.,1,AGI(agi://127.0.0.1:4577/call_log)
same => n,Set(CURLOPT(conntimeout)=5)

same => n,Set(NUMBER=${EXTEN:2})

same => n,Set(TRUNK=${RAND(1,3)})
same => n,Set(TRYCOUNT=1)

same => n(start),NoOp(Calling ${NUMBER} using TBI_${TRUNK} - Try ${TRYCOUNT})
same => n,Dial(SIP/<route-prefix>#${NUMBER}@TBI_${TRUNK},60,tTor)
same => n,Gosub(gxsipcause,1(${TRUNK}))
same => n,NoOp(TBI_${TRUNK} result: DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE} SIPCAUSE=${SIPCAUSE})

; If answered, finish
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)

; Retry only on failover-type conditions
; GenX 2026-10-29: a 603 Decline is final - every TBI trunk declines it (0 humans in 32 failover answers)
same => n,GotoIf(${REGEX("^SIP 603" ${GXSIPCAUSE})}?done)
same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?retry)
same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?retry)
same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?retry)
same => n,GotoIf($["${HANGUPCAUSE}"="21"]?retry)
same => n,GotoIf($["${HANGUPCAUSE}"="34"]?retry)

; Do not retry normal failures
same => n,Goto(done)

same => n(retry),Set(TRYCOUNT=$[${TRYCOUNT}+1])
same => n,GotoIf($[${TRYCOUNT} > 3]?done)

; Move to next trunk
same => n,Set(TRUNK=$[${TRUNK}+1])
same => n,GotoIf($[${TRUNK} > 3]?reset_trunk)
same => n,Goto(start)

same => n(reset_trunk),Set(TRUNK=1)
same => n,Goto(start)

same => n(done),NoOp(Final result: DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE} SIPCAUSE=${SIPCAUSE})
same => n,Hangup()

; ---- 3. subroutine, appended once to the carrier entry ----
; GenX 2026-10-28: GXSIPCAUSE = SIP cause of the LAST Dial attempt (ARG1 = trunk number).
; With failover retries a call has several dialed channels, and the stock h handler's
; HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech) then returns nothing, so vicidial_carrier_log got 0.
; The [default] h handler logs GXSIPCAUSE when it is set.
exten => gxsipcause,1,Set(GXSIPCAUSE=)
same => n,Set(GX_K=${HANGUPCAUSE_KEYS()})
same => n,Set(GX_N=${FIELDQTY(GX_K,\,)})
same => n,Set(GX_I=1)
same => n(loop),GotoIf($[${GX_I} > ${GX_N}]?end)
same => n,Set(GX_C=${CUT(GX_K,\,,${GX_I})})
same => n,GotoIf(${REGEX("^SIP/TBI_${ARG1}-" ${GX_C})}?found)
same => n,Set(GX_I=$[${GX_I} + 1])
same => n,Goto(loop)
same => n(found),Set(GXSIPCAUSE=${HANGUPCAUSE(${GX_C},tech)})
same => n(end),Return()

