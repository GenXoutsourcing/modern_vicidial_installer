; carrier-sipcause-gosub.conf - GenX 2026-10-28 (Aragon, TBI carrier with TBI_1..3 failover)
; Fix for carrier dialplans that retry on another trunk: with several Dial() attempts HANGUPCAUSE_KEYS()
; returns a comma list and the stock [default] h handler logs SIP cause 0 to vicidial_carrier_log.
; See ../amdy-and-carrier-status-maps.md section 3. Adjust the "SIP/TBI_" channel prefix to your peers.

; ---- 1. [default] h handler (extensions.conf on every dialer; replace the stock line in [default] only) ----
exten => h,1,AGI(agi://127.0.0.1:4577/call_log--HVcauses--PRI-----NODEBUG-----${HANGUPCAUSE}-----${DIALSTATUS}-----${DIALEDTIME}-----${ANSWEREDTIME}-----${IF($["${GXSIPCAUSE}"!=""]?${GXSIPCAUSE}:${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)})}))

; ---- 2. carrier entry: one route shown; the Gosub goes right after EVERY Dial() (keeps the Dial priority number,
;         so calls inside Dial during a live reload resume correctly) ----
exten => _781.,1,AGI(agi://127.0.0.1:4577/call_log)
same => n,Set(CURLOPT(conntimeout)=5)

same => n,Set(NUMBER=${EXTEN:2})

same => n,Set(TRUNK=${RAND(1,3)})
same => n,Set(TRYCOUNT=1)

same => n(start),NoOp(Calling ${NUMBER} using TBI_${TRUNK} - Try ${TRYCOUNT})
same => n,Dial(SIP/<route-prefix>#${NUMBER}@TBI_${TRUNK},${IF($["${CAMPDTO}"=""]?60:${CAMPDTO})},tTor)
same => n,Gosub(gxsipcause,1(${TRUNK}))
same => n,NoOp(TBI_${TRUNK} result: DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE} SIP=${GXSIPCAUSE})

; If answered, finish
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)

; Retry only on trunk/network failures (GenX 2026-10-28). Carrier rejects (BUSY: 603/403/486)
; and unallocated numbers (CHANUNAVAIL cause 1 = 404) are final: another trunk only repeats the reject.
same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?retry)
same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL" & "${HANGUPCAUSE}"!="1"]?retry)
same => n,GotoIf($["${HANGUPCAUSE}"="34"]?retry)

; Do not retry normal failures
same => n,Goto(done)

same => n(retry),Set(TRYCOUNT=$[${TRYCOUNT}+1])
same => n,GotoIf($[${TRYCOUNT} > 3]?done)

; Move to next trunk
same => n,Set(TRUNK=$[${TRUNK}+1])
same => n,GotoIf($[${TRUNK} > 3]?reset_trunk)
same => n,Goto(start)

same => n(reset_trunk),Set(TRUNK=1)
same => n,Goto(start)

same => n(done),NoOp(Final result: DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE} SIP=${GXSIPCAUSE})

; ---- 3. subroutine, appended once to the carrier entry ----
; GenX 2026-10-28: GXSIPCAUSE = SIP cause of the LAST Dial attempt (ARG1 = trunk number).
; With failover retries a call has several dialed channels, and the stock h handler's
; HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech) then returns nothing, so vicidial_carrier_log got 0.
; The [default] h handler logs GXSIPCAUSE when it is set.
exten => gxsipcause,1,Set(GXSIPCAUSE=)
same => n,Set(GX_K=${HANGUPCAUSE_KEYS()})
same => n,Set(GX_N=${FIELDQTY(GX_K,\,)})
same => n,Set(GX_I=1)
same => n(loop),GotoIf($[${GX_I} > ${GX_N}]?end)
same => n,Set(GX_C=${CUT(GX_K,\,,${GX_I})})
same => n,GotoIf(${REGEX("^SIP/TBI_${ARG1}-" ${GX_C})}?found)
same => n,Set(GX_I=$[${GX_I} + 1])
same => n,Goto(loop)
same => n(found),Set(GXSIPCAUSE=${HANGUPCAUSE(${GX_C},tech)})
same => n(end),Return()

