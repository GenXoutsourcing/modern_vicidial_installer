; ============================================================================
; GenX load-test: simulated "customer" far end, for an EXTERNAL sink box.
;
; This context runs on a dedicated box (NOT a viciboxclone telephony server) so
; the cluster's sip1/2/3 carry only real single-leg trunk traffic — the honest,
; production-shaped load. It replaces the in-cluster GENXLOOP loopback, whose
; second (customer) leg + far-end media doubled the telephony boxes' load.
;
; Reached as an inbound SIP call from the cluster's telephony boxes via the
; GENXLOOP / GENXSINK2 carriers (each carrier's host = a sink box running this).
; Same behavior mix as the loopback sink: 12% busy, 25% ring-no-answer, 63%
; answered (of answers: ~80% human / ~20% machine, to exercise campaign AMD).
;
; Install with tools/loadtest/setup-sink-box.sh (wires the #include + firewall).
; ============================================================================
[genx-loadtest-behave]
exten => _behXXXXXXXXXX,1,Set(LTR=${RAND(1,100)})
 same => n,GotoIf($[${LTR} <= 12]?ltbusy,1)
 same => n,GotoIf($[${LTR} <= 37]?ltnoans,1)
 same => n,Ringing()
 same => n,Wait(${RAND(2,7)})
 same => n,Answer()
 same => n,GotoIf($[${LTR} > 87]?ltmachine,1)
 ; app_amd HUMAN pattern: brief pause, ONE short word, then quiet ("hello?").
 ; Real audio frames required — Wait() sends none, sip-silence carries GSM noise
 ; above silenceThreshold; use true silence/* + a single digits word.
 same => n,Playback(silence/1&digits/1&silence/2)
 same => n,StartMusicOnHold()
 same => n,Wait(${RAND(20,90)})
 same => n,Hangup()

exten => ltmachine,1,StartMusicOnHold()
 same => n,Wait(30)
 same => n,Hangup()

exten => ltbusy,1,Busy(4)

exten => ltnoans,1,Ringing()
 same => n,Wait(50)
 same => n,Hangup(19)
