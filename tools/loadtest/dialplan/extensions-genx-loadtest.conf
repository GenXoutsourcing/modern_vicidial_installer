; ============================================================================
; GenX load-test dialplan (TEMPORARY). Installed on telephony boxes by
; tools/loadtest setup; removed by tools/loadtest/teardown.sh.
; Reached via `include => genx-loadtest` inside [default] in extensions.conf.
;
; Two jobs:
;  1) Simulated "customer" sink for the LOADTEST campaign (dial_prefix 77).
;     Structured EXACTLY like a stock carrier entry (call_log AGI -> Dial ->
;     HVcauses h handler) so DIALSTATUS/HANGUPCAUSE/DIALEDTIME are real and
;     the stock NA/B/DROP logging + na_call_url pipeline fires normally. The
;     "carrier" is a Local leg into [genx-loadtest-behave], which answers /
;     busies / rings-out on a fixed probability mix. Zero PSTN traffic.
;  2) Auto-answer agent leg for protocol-tier simulated agents (Local/LT2xx):
;     answers instantly and parks for the shift, exactly where a webphone
;     auto-answer would sit.
; ============================================================================
[genx-loadtest]
exten => _77XXXXXXXXXX,1,AGI(agi://127.0.0.1:4577/call_log)
 same => n,Dial(Local/beh${EXTEN:2}@genx-loadtest-behave/n,,To)
 same => n,Hangup()

; stock hangup-cause logger, byte-for-byte what the carrier contexts use
exten => h,1,AGI(agi://127.0.0.1:4577/call_log--HVcauses--PRI-----NODEBUG-----${HANGUPCAUSE}-----${DIALSTATUS}-----${DIALEDTIME}-----${ANSWEREDTIME}-----${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)}))

; --- protocol-tier agent leg: auto-answer, park for the shift ---
exten => _LT2XX,1,Answer()
 same => n,Wait(14400)
 same => n,Hangup()

; ============================================================================
; The simulated far end: 12% busy, 25% ring-no-answer (outlives the campaign
; dial_timeout so the originate cancels), 63% answered with 20-90s of MOH.
; ============================================================================
[genx-loadtest-behave]
exten => _behXXXXXXXXXX,1,Set(LTR=${RAND(1,100)})
 same => n,GotoIf($[${LTR} <= 12]?ltbusy,1)
 same => n,GotoIf($[${LTR} <= 37]?ltnoans,1)
 same => n,Ringing()
 same => n,Wait(${RAND(2,7)})
 same => n,Answer()
 same => n,StartMusicOnHold()
 same => n,Wait(${RAND(20,90)})
 same => n,Hangup()

exten => ltbusy,1,Busy(4)

exten => ltnoans,1,Ringing()
 same => n,Wait(50)
 same => n,Hangup(19)
