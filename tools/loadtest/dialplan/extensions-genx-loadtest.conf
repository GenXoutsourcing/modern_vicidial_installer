; ============================================================================
; GenX load-test dialplan (TEMPORARY). Installed on telephony boxes by
; tools/loadtest/deploy notes; removed by tools/loadtest/teardown.sh.
; Reached via `include => genx-loadtest` inside [default] in extensions.conf.
;
; Two jobs:
;  1) Simulated "customer" sink for the LOADTEST campaign (dial_prefix 77):
;     answers / busies / rings-out with a fixed probability mix so the dialer
;     sees a realistic dialstatus spread with zero PSTN traffic.
;  2) Auto-answer agent leg for protocol-tier simulated agents (Local/LT2xx):
;     answers instantly and parks for the shift, exactly where a webphone
;     auto-answer would sit.
; ============================================================================
[genx-loadtest]
; stock hangup-cause logger, same as the carrier contexts use
exten => h,1,AGI(agi://127.0.0.1:4577/call_log--HVcauses--PRI-----NODEBUG-----${HANGUPCAUSE}-----${DIALSTATUS}-----${DIALEDTIME}-----${ANSWEREDTIME}-----${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)})

; --- simulated customer: LOADTEST dial_prefix 77 + 10-digit lead number ---
; 12% busy, 25% ring-no-answer, 63% answered with 20-90s of MOH "talk"
exten => _77XXXXXXXXXX,1,Set(LTR=${RAND(1,100)})
 same => n,GotoIf($[${LTR} <= 12]?ltbusy,1)
 same => n,GotoIf($[${LTR} <= 37]?ltnoans,1)
 same => n,Ringing()
 same => n,Wait(${RAND(2,7)})
 same => n,Answer()
 same => n,StartMusicOnHold()
 same => n,Wait(${RAND(20,90)})
 same => n,Hangup()

exten => ltbusy,1,Busy(4)

exten => ltnoans,1,Ringing()
 same => n,Wait(50)
 same => n,Hangup(19)

; --- protocol-tier agent leg: auto-answer, park for the shift ---
exten => _LT2XX,1,Answer()
 same => n,Wait(14400)
 same => n,Hangup()
