<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenX Contact Center - Mission Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Manager Dashboard cleanup: remove the QA & Recording Review panel
      // from Mission Control while leaving the QA/Recordings navigation intact.
      (() => {
        const removeManagerQaPanel = () => {
          document.querySelectorAll('.mpanel').forEach((panel) => {
            const heading = panel.querySelector('h3');
            if (heading?.textContent?.trim() === 'QA & Recording Review') {
              panel.remove();
            }
          });
        };

        const observer = new MutationObserver(removeManagerQaPanel);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', removeManagerQaPanel);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
